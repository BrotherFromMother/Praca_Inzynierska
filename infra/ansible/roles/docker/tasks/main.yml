---
- name: Utwórz katalog na klucze repozytoriów
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Pobierz klucz GPG repozytorium Dockera
  ansible.builtin.get_url:
    url: "{{ docker_apt_repository_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dodaj repozytorium Dockera
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris: "{{ docker_apt_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    signed_by: /etc/apt/keyrings/docker.asc

- name: Zainstaluj pakiety Dockera
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Uruchom usługę Docker i włącz ją przy starcie systemu
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Dodaj użytkowników do grupy docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
