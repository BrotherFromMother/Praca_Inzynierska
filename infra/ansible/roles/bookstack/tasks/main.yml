---
- name: Utwórz katalog usługi BookStack
  ansible.builtin.file:
    path: "{{ bookstack_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Utwórz plik Compose usługi BookStack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bookstack_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Uruchom usługę BookStack
  community.docker.docker_compose_v2:
    project_src: "{{ bookstack_stack_dir }}"
    state: present
    wait: true
    wait_timeout: 300

- name: Poczekaj, aż BookStack odpowie przez Traefika
  ansible.builtin.uri:
    url: "https://{{ bookstack_domain }}/login"
    status_code: 200
  register: bookstack_health
  until: bookstack_health.status == 200
  retries: 30
  delay: 10

- name: Przypisz grupy AD do ról BookStacka
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - bookstack-db
      - sh
      - -c
      - >-
        mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -N -B bookstack -e
        "UPDATE roles SET external_auth_id='{{ item.group }}'
        WHERE system_name='{{ item.role }}' OR LOWER(display_name)='{{ item.role }}';
        SELECT ROW_COUNT();"
  loop: "{{ bookstack_role_mapping }}"
  loop_control:
    label: "{{ item.role }} -> {{ item.group }}"
  register: bookstack_role_update
  changed_when: bookstack_role_update.stdout | trim != '0'
