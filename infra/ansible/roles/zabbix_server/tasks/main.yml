---
- name: Utwórz katalog usługi Zabbix
  ansible.builtin.file:
    path: "{{ zabbix_server_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Utwórz plik Compose usługi Zabbix
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ zabbix_server_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Uruchom usługę Zabbix
  community.docker.docker_compose_v2:
    project_src: "{{ zabbix_server_stack_dir }}"
    state: present
    wait: true
    wait_timeout: 300

- name: Poczekaj, aż interfejs Zabbixa odpowie przez Traefika
  ansible.builtin.uri:
    url: "https://{{ zabbix_server_domain }}/"
    status_code: 200
  register: zabbix_server_health
  until: zabbix_server_health.status == 200
  retries: 30
  delay: 10
