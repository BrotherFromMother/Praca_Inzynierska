---
backup_nfs_server: 192.168.1.80
backup_nfs_export: /volume1/homelab-backup
backup_mount_point: /mnt/homelab-backup
backup_repo: "{{ backup_mount_point }}/restic/{{ inventory_hostname }}"
backup_password_file: /etc/restic/password
backup_staging_dir: /var/backups/homelab
backup_status_dir: /var/lib/homelab-backup
backup_schedule: "*-*-* 01:30:00"
backup_keep_daily: 7
backup_keep_weekly: 4
backup_type: none
backup_docker_stacks: []
