---
samba_dc_realm: AD.HOMELAB.INTERNAL
samba_dc_dns_domain: ad.homelab.internal
samba_dc_netbios_domain: HOMELAB
samba_dc_host_ip: "{{ ansible_host }}"
samba_dc_fqdn: "{{ inventory_hostname }}.{{ samba_dc_dns_domain }}"
samba_dc_dns_forwarder: 192.168.1.1

samba_dc_packages:
  - samba
  - samba-ad-dc
  - samba-dsdb-modules
  - samba-vfs-modules
  - smbclient
  - krb5-user
  - ldb-tools
  - dnsutils
  - acl
  - attr

# --- Struktura katalogu ---
samba_dc_base_dn: "DC={{ samba_dc_dns_domain.split('.') | join(',DC=') }}"
samba_dc_org_ou: OU=Homelab

samba_dc_ous:
  - OU=Homelab
  - OU=Uzytkownicy,OU=Homelab
  - OU=Grupy,OU=Homelab
  - OU=KontaUslugowe,OU=Homelab

samba_dc_groups:
  - grp-it-admins
  - grp-gitea-users
  - grp-wiki-users
  - grp-zabbix-users

samba_dc_ldap_bind_user: svc-ldap-bind
samba_dc_users: []

samba_dc_service_zone: homelab.internal
samba_dc_service_records: []
