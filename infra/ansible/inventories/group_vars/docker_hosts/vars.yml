---
step_ca_password: "{{ vault_step_ca_password }}"
gitea_db_password: "{{ vault_gitea_db_password }}"
gitea_secret_key: "{{ vault_gitea_secret_key }}"
gitea_internal_token: "{{ vault_gitea_internal_token }}"
bookstack_app_key: "{{ vault_bookstack_app_key }}"
bookstack_db_password: "{{ vault_bookstack_db_password }}"
bookstack_db_root_password: "{{ vault_bookstack_db_root_password }}"
zabbix_db_password: "{{ vault_zabbix_db_password }}"

# Agent Zabbix na hostach z Dockerem
zabbix_agent_docker: true
zabbix_agent_server: "192.168.1.41,172.30.0.0/24"

# Kopie zapasowe: usługi kopiowane na zimno (zatrzymanie, kopia wolumenów, start)
backup_type: docker
backup_docker_stacks:
  - { name: step-ca, dir: /opt/stack/step-ca, volumes: [step-ca_step-ca-data] }
  - { name: gitea, dir: /opt/stack/gitea, volumes: [gitea_gitea-data, gitea_gitea-db] }
  - { name: bookstack, dir: /opt/stack/bookstack, volumes: [bookstack_bookstack-config, bookstack_bookstack-db] }
  - { name: zabbix, dir: /opt/stack/zabbix, volumes: [zabbix_zabbix-db] }
