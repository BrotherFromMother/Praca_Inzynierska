---
samba_dc_admin_password: "{{ vault_samba_admin_password }}"
samba_dc_ldap_bind_password: "{{ vault_samba_ldap_bind_password }}"

samba_dc_users:
  - name: jan.kowalski
    given_name: Jan
    surname: Kowalski
    password: "{{ vault_samba_user_jan_password }}"
    groups:
      - grp-gitea-users
      - grp-wiki-users
      - grp-zabbix-users
  - name: anna.nowak
    given_name: Anna
    surname: Nowak
    password: "{{ vault_samba_user_anna_password }}"
    groups:
      - grp-it-admins
      - grp-gitea-users
      - grp-wiki-users
      - grp-zabbix-users

samba_dc_service_zone: homelab.internal
samba_dc_service_records:
  - { name: svc01, ip: 192.168.1.41 }
  - { name: ca, ip: 192.168.1.41 }
  - { name: git, ip: 192.168.1.41 }
  - { name: wiki, ip: 192.168.1.41 }
  - { name: zabbix, ip: 192.168.1.41 }
  - { name: whoami, ip: 192.168.1.41 }
